name: Update NOAA storm data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download NHC HURDAT2 data
        run: |
          mkdir -p data
          curl -L --fail "https://www.nhc.noaa.gov/data/hurdat/hurdat2-1851-2025-02272026.txt" -o data/atlantic.txt
          curl -L --fail "https://www.nhc.noaa.gov/data/hurdat/hurdat2-nepac-1949-2025-02272026.txt" -o data/pacific.txt

      - name: Commit storm data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/atlantic.txt data/pacific.txt
          git commit -m "Update NOAA hurricane data" || exit 0
          git push
